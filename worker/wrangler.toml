name = "donationkings-api"
main = "index.js"
compatibility_date = "2026-11-01"

# Origins allowed to call this Worker. The GitHub Pages site plus the local
# dev server. Anything else is refused before a token is even checked.
# The origin check is NOT the security boundary (Origin is trivially forged
# outside a browser); the Firebase token is. This just stops other sites'
# pages from using the API.
[vars]
ALLOWED_ORIGINS = "https://leydagrant-ux.github.io,http://localhost:8791"

# Your Firebase project id. Tokens are accepted only if their audience and
# issuer match this exactly. Reuse the LockIN project or make a new one; a new
# one keeps the two apps' accounts separate, which is probably what you want
# since friends will have DonationKings accounts and not LockIN ones.
FIREBASE_PROJECT_ID = "donationkings"

# D1. Create it once and paste the id it prints:
#   npx wrangler d1 create donationkings
[[d1_databases]]
binding = "DB"
database_name = "donationkings"
database_id = "493d5b49-72cb-4b72-b21e-6244cc318b3d"

# The scheduled grader. Every five minutes is plenty: a lock is only looked
# at once its games should be over, so most ticks find nothing due and cost
# a single indexed query. The free plan allows 5 cron triggers per account
# and this is one of them.
[triggers]
crons = ["*/5 * * * *"]

# Workers AI, for reading bet slip screenshots. The free tier is a daily
# neuron allowance shared across models. Groq retired every vision model
# during 2026, so this runs on Cloudflare rather than there.
[ai]
binding = "AI"

# The TV overlay route, GET /overlay/parlays. Read only, one person's open
# locks, its own shared token, and no Firebase: the client is a Python script
# on the house wifi (see ../../FantasyOverlay). Two secrets, neither of them
# ever in this file or in this repo:
#
#   OVERLAY_TOKEN   a long random string, shared with that one machine. The
#                   route refuses to serve if it is shorter than 32 chars, so
#                   a half-finished deploy fails closed rather than open.
#   OVERLAY_UID     whose locks to serve. A secret rather than a request
#                   parameter on purpose: there is then no way to point the
#                   token at anybody else's bets.
#
# Set them without an interactive prompt (note --config: see the warning at
# the bottom of this file):
#
#   "$TOKEN" | npx wrangler secret put OVERLAY_TOKEN --config wrangler.toml
#   "$UID"   | npx wrangler secret put OVERLAY_UID   --config wrangler.toml
#
# Optional: OVERLAY_MAX_SUMMARIES caps box scores per poll. Default 6.

# No other secrets needed. If Workers AI turns out not to read slips accurately
# enough, Gemini Flash is the fallback plan and would add one:
#   npx wrangler secret put GEMINI_API_KEY

# Setup, once:
#   cd worker
#   npx wrangler d1 create donationkings          # paste database_id above
#   npx wrangler d1 execute donationkings --local  --file=./schema.sql
#   npx wrangler d1 execute donationkings --remote --file=./schema.sql
#   npx wrangler deploy --config wrangler.toml
#
# Local development, which runs the real Worker against a local D1:
#   npx wrangler dev --local --config wrangler.toml

# A TRAP, found the hard way. There is a stray `wrangler.jsonc` two levels up
# (in the Claude folder) that names a different worker. Wrangler walks up and
# picks it up IN PREFERENCE to this file, even when run from inside this
# directory, so a plain `npx wrangler deploy` here deploys the wrong worker.
# Always pass the config explicitly:
#
#   npx wrangler deploy --config wrangler.toml
#
# Same for `wrangler secret put` and everything else.
